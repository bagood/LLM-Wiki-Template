[project]
name = "llm-wiki-mcp"
version = "0.1.0"
description = "Provider-independent OKF research MCP server (P0 foundation)"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.119,<1",
  "uvicorn>=0.38,<1",
  "mcp==2.3.0",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "markdown-it-py>=4,<5",
  "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "types-pyyaml>=6,<7",
  "jsonschema>=4.25,<5",
  "types-jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki_mcp"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

